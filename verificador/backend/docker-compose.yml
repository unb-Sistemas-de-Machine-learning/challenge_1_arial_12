services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./main.py:/app/main.py:ro
      - ./src:/app/src:ro
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verificador
      POSTGRES_PASSWORD: verificador
      POSTGRES_DB: verificador
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
