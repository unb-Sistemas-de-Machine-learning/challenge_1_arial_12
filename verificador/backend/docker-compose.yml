services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./main.py:/app/main.py
      - ./src:/app/src
    # Trocar para src.main:app quando a aplicacao sair do stub.
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verificador
      POSTGRES_PASSWORD: verificador
      POSTGRES_DB: verificador
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
